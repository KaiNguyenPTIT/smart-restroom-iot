; PlatformIO — ESP32 Smart Restroom
; Board: esp32dev. Wokwi dùng board-esp32-devkit-c-v4 (khai báo riêng trong wokwi.toml).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^6.21.5

; Token ThingsBoard KHÔNG commit. Truyền khi build:
;   pio run -t upload --project-option "build_flags=-DTB_TOKEN=\"<token>\""
; hoặc export TB_TOKEN rồi dùng extra_script để sinh build flag.
build_flags =
    -DCORE_DEBUG_LEVEL=0
